name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same Postgres as docker-compose.yml, so the integration tests run
    # instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Generated code is up to date (sqlc)
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/db || {
            echo "internal/db is out of date: run 'make sqlc' and commit the result"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Migrate
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.28.0 -dir internal/db/migrations postgres "$DATABASE_URL" up

      - name: Test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # next-env.d.ts and route types are generated, not committed.
      - run: npx next typegen

      - run: npm run typecheck
